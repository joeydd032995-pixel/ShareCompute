name: Native three-device model split
on:
  pull_request:
    paths: ['native/split/**', 'Apps/ComputeWorker/**', 'Apps/AndroidWorker/**', 'scripts/*split*', 'scripts/build_stamp.py', 'scripts/run_log.py', 'scripts/verify_ios_simulator.py', '.github/workflows/three-device-split.yml']
  push:
    branches: [main]
    paths: ['native/split/**', 'Apps/ComputeWorker/**', 'Apps/AndroidWorker/**', 'scripts/*split*', 'scripts/build_stamp.py', 'scripts/run_log.py', 'scripts/verify_ios_simulator.py', '.github/workflows/three-device-split.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - uses: hendrikmuhs/ccache-action@v1.2
        if: runner.os == 'Linux'
        with:
          key: desktop-linux
          max-size: 500M
      - uses: actions/cache@v4
        with:
          path: models
          key: split-model-${{ hashFiles('scripts/download_split_model.py') }}
      - run: python scripts/test_split_cluster.py -v
      - run: python scripts/build_split_runtime.py --jobs 3
        env: {CMAKE_C_COMPILER_LAUNCHER: "${{ runner.os == 'Linux' && 'ccache' || '' }}", CMAKE_CXX_COMPILER_LAUNCHER: "${{ runner.os == 'Linux' && 'ccache' || '' }}"}
      - run: python scripts/download_split_model.py
      - run: python scripts/verify_split_runtime.py --bin-dir build/desktop/bin --model models/split-proof.gguf --out split-runs/ci
      - run: python scripts/verify_parallel_load.py --bin-dir build/desktop/bin --model models/split-proof.gguf --out split-runs/ci/parallel-load.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-${{ matrix.os }}
          path: |
            build/desktop/bin/
            build/desktop/runtime-revision.txt
            build/desktop/THIRD_PARTY_NOTICES.txt
            split-runs/ci/*/report.json
            split-runs/ci/*/*.log
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # PR branches get a read-only Gradle cache by default, so every run re-downloaded
          # its dependencies from Maven Central and could hit its 429 rate limit.
          cache-read-only: false
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 500M
      - run: python scripts/build_split_runtime.py --platform android --ndk "$ANDROID_NDK_HOME" --jobs 3
        env: {CMAKE_C_COMPILER_LAUNCHER: ccache, CMAKE_CXX_COMPILER_LAUNCHER: ccache}
      - name: Package Android app
        run: |
          export SC_NDK_VERSION="$(basename "$ANDROID_NDK_HOME")"
          gradle -p Apps/AndroidWorker assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: split-android-apk
          path: Apps/AndroidWorker/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: split-android-arm64
          path: |
            build/android/bin/
            build/android/runtime-revision.txt
            build/android/THIRD_PARTY_NOTICES.txt
  ios:
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, ios-simulator]
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - run: python scripts/build_split_runtime.py --platform ${{ matrix.platform }} --jobs 3
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          export SC_NATIVE_DIR="$PWD/build/${{ matrix.platform }}"
          xcodegen generate --spec Apps/ComputeWorker/project.yml
      - name: Build native iOS application
        run: |
          SDK=iphoneos
          if [ '${{ matrix.platform }}' = ios-simulator ]; then SDK=iphonesimulator; fi
          xcodebuild -project Apps/ComputeWorker/ComputeWorker.xcodeproj -scheme ComputeWorker -configuration Release -sdk "$SDK" -derivedDataPath build/app ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned device app
        if: matrix.platform == 'ios'
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/app/Build/Products/Release-iphoneos/ComputeWorker.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../ShareCompute-unsigned.ipa Payload
      - name: Build laptop coordinator for simulator
        if: matrix.platform == 'ios-simulator'
        run: python scripts/build_split_runtime.py --jobs 3
      - uses: actions/cache@v4
        if: matrix.platform == 'ios-simulator'
        with:
          path: models
          key: split-model-${{ hashFiles('scripts/download_split_model.py') }}
      - name: Download simulator proof model
        if: matrix.platform == 'ios-simulator'
        run: python scripts/download_split_model.py
      - name: Execute native iOS simulator computation
        if: matrix.platform == 'ios-simulator'
        run: python -u scripts/verify_ios_simulator.py --app build/app/Build/Products/Release-iphonesimulator/ComputeWorker.app --bin-dir build/desktop/bin --model models/split-proof.gguf --out split-runs/ios-simulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-${{ matrix.platform }}
          path: |
            build/ShareCompute-unsigned.ipa
            build/${{ matrix.platform }}/runtime-revision.txt
            build/${{ matrix.platform }}/THIRD_PARTY_NOTICES.txt
            split-runs/ios-simulator/report.json
            split-runs/ios-simulator/*.log

  # Speed experiment E4 (F56). The phones' runtimes are built for plain NEON while their CPUs report dotprod
  # (the Android phone) and dotprod plus i8mm (the iPhone). These two jobs build the same apps with those
  # instructions on, prove the instructions are in the binaries, and upload each app under its own name for an
  # A/B on the operator's devices. Neither feeds the test kit or the release: a variant crashes on a CPU
  # without the feature, and each changes rounding, so a variant run may fail the token gate on that alone.
  android-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 500M
      - run: python scripts/test_check_split_arm_kernels.py -v
      - name: Build the baseline libraries (the control for the instruction check)
        run: python scripts/build_split_runtime.py --platform android --ndk "$ANDROID_NDK_HOME" --jobs 3 --out build/android-base
        env: {CMAKE_C_COMPILER_LAUNCHER: ccache, CMAKE_CXX_COMPILER_LAUNCHER: ccache}
      - name: Build the dotprod libraries
        run: python scripts/build_split_runtime.py --platform android --ndk "$ANDROID_NDK_HOME" --jobs 3 --arm-arch armv8.2-a+dotprod
        env: {CMAKE_C_COMPILER_LAUNCHER: ccache, CMAKE_CXX_COMPILER_LAUNCHER: ccache}
      - name: Prove the dotprod instructions are in the binary
        run: >
          python scripts/check_split_arm_kernels.py
          --objdump "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          --baseline build/android-base/lib/libggml-cpu.a --variant build/android/lib/libggml-cpu.a --expect sdot
      - name: Package Android app
        run: |
          export SC_NDK_VERSION="$(basename "$ANDROID_NDK_HOME")"
          gradle -p Apps/AndroidWorker assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: split-android-apk-dotprod
          path: Apps/AndroidWorker/app/build/outputs/apk/debug/*.apk

  ios-arm:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.0
      - run: python scripts/test_check_split_arm_kernels.py -v
      - name: Build the baseline libraries (the control for the instruction check)
        run: python scripts/build_split_runtime.py --platform ios --jobs 3 --out build/ios-base
      - name: Build the dotprod and i8mm libraries
        run: python scripts/build_split_runtime.py --platform ios --jobs 3 --arm-arch armv8.6-a+i8mm+dotprod
      - name: Prove the dotprod and i8mm instructions are in the binary
        run: |
          OBJDUMP="xcrun llvm-objdump"
          xcrun --find llvm-objdump >/dev/null 2>&1 || OBJDUMP="xcrun objdump"
          python scripts/check_split_arm_kernels.py --objdump "$OBJDUMP" \
            --baseline build/ios-base/lib/libggml-cpu.a --variant build/ios/lib/libggml-cpu.a --expect sdot smmla
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          export SC_NATIVE_DIR="$PWD/build/ios"
          xcodegen generate --spec Apps/ComputeWorker/project.yml
      - name: Build native iOS application
        run: xcodebuild -project Apps/ComputeWorker/ComputeWorker.xcodeproj -scheme ComputeWorker -configuration Release -sdk iphoneos -derivedDataPath build/app ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned device app
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/app/Build/Products/Release-iphoneos/ComputeWorker.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../ShareCompute-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: split-ios-ipa-i8mm
          path: build/ShareCompute-unsigned.ipa

  test-kit:
    needs: [desktop, android, ios]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: split-${{ matrix.os }}
          path: build/desktop-artifact
      - name: Restore native binaries
        shell: bash
        run: |
          mkdir -p build/desktop
          cp -R build/desktop-artifact/build/desktop/* build/desktop/
          chmod +x build/desktop/bin/* || true
      - run: python -m pip install cryptography==46.0.0 qrcode==8.2 pyinstaller==6.16.0
      - run: python scripts/test_split_launcher.py -v
      - run: python scripts/build_split_kit.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/download_split_model.py
      - name: Execute packaged app with real split model
        shell: bash
        run: |
          EXE=dist/ShareCompute/ShareCompute
          if [ '${{ runner.os }}' = Windows ]; then EXE="$EXE.exe"; fi
          "$EXE" --self-test-model models/split-proof.gguf --data-dir split-runs/packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ShareCompute-${{ runner.os }}
          path: dist/ShareCompute-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-proof-${{ runner.os }}
          path: |
            split-runs/packaged/self-test/report.json
            split-runs/packaged/self-test/*.log
  release:
    # One place to download everything: the "latest" release holds exactly four files,
    # named by device. Public, no GitHub sign-in, and no 90-day expiry like artifacts.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-kit, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Collect the four device downloads
        run: |
          mkdir -p out
          cp "$(find parts/ShareCompute-Windows -name 'ShareCompute-Windows.zip')" out/ShareCompute-Windows-laptop.zip
          cp "$(find parts/ShareCompute-Linux -name 'ShareCompute-Linux.zip')" out/ShareCompute-Linux-laptop.zip
          cp "$(find parts/split-android-apk -name '*.apk' | head -n1)" out/ShareCompute-Android-phone.apk
          cp "$(find parts/split-ios -name 'ShareCompute-unsigned.ipa')" out/ShareCompute-iPhone-unsigned.ipa
          ls -l out
      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Built from commit ${GITHUB_SHA} (run ${GITHUB_RUN_ID}). Take the laptop file for your OS plus the Android and iPhone files. The IPA is unsigned: install it with SideStore. See docs/TEST-KIT-QUICKSTART.md."
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ShareCompute latest build" --notes "$NOTES"
