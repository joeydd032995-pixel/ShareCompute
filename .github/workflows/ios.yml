name: iOS build

# Builds the Infer Ring app for the iOS Simulator.
#
# There is no Test step: the app project has eight native targets and *zero*
# test bundles, so `test-without-building` could only ever fail. The Swift
# package's tests run in core.yml instead.
#
# Like the macOS job, expect real failures before this goes green -- none of
# the Apple-side Swift has ever been type-checked.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Not at the repository root -- see the note in objective-c-xcode.yml.
  PROJECT: "Apps/InferRing/Infer Ring.xcodeproj"
  SCHEME: "Infer Ring"

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Available toolchains
        # Recorded for diagnosis: the pinned mlx-swift vendors fmt 10.2.1, which
        # does not compile under Xcode 26's clang (findings.md F17). The fix now
        # lives in the fork's Package.swift (Patches/mlx-swift/0003) rather than
        # here, so this job passes no flags for it. If that ever stops working,
        # pinning an older Xcode is the fallback -- this listing says which exist.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(no versioned Xcodes)"
          xcodebuild -version

      - name: Confirm the scheme exists
        run: xcodebuild -list -project "$PROJECT"

      - name: Build
        # A *generic* simulator destination avoids the starter workflow's
        # `xcrun xctrace list devices | grep iPhone` device-name scrape, which
        # breaks whenever the runner image's simulator set changes. Nothing is
        # run, so no booted device is needed.
        #
        # ARCHS=arm64 is load-bearing. A generic simulator destination builds
        # every slice, including x86_64 for Intel Macs, and MLX is
        # Apple-Silicon-only -- the first run died compiling the x86_64 slice of
        # Cmlx. There is no x86_64 story for this app, so don't build one.
        #
        # The raw log is kept because xcpretty swallows compiler diagnostics:
        # the first failure reported only which command failed, never why.
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-ios.log | xcpretty

      - name: Surface compiler errors
        if: failure()
        run: |
          echo "===== error: lines, with context ====="
          grep -E -B2 -A8 "error:" /tmp/xcodebuild-ios.log | head -150 \
            || echo "(no 'error:' lines -- the failure was not a compile error)"
          echo "===== last 60 raw lines ====="
          tail -60 /tmp/xcodebuild-ios.log
