name: Xcode - Build and Analyze

# Builds the Infer Ring macOS app. This is the only place the Apple-side Swift
# gets type-checked at all: it has never been compiled, and `swiftc -parse`
# (all it gets locally) checks syntax without resolving imports or types.
#
# Expect this to fail for real reasons before it goes green. The first one is
# likely dependency resolution -- project.pbxproj asks for N1k1tung/mlx-swift at
# `kind = branch, branch = "ios-distrib-0.3.0"`, but on that remote the name
# exists only as a *tag*. See findings.md F13; this job is what settles it.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # The .xcodeproj is not at the repository root -- the root is the
  # ShareComputeCore Swift package. The starter workflow's `xcodebuild -list`
  # auto-detection resolved the package as a *workspace* and then failed
  # parsing a `project` key that was not there.
  PROJECT: "Apps/InferRing/Infer Ring.xcodeproj"
  SCHEME: "Infer Ring"

jobs:
  build:
    name: Build and analyse the Infer Ring scheme
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Confirm the scheme exists
        # Fail here with a clear message rather than inside xcodebuild if the
        # project layout or scheme name ever moves.
        run: xcodebuild -list -project "$PROJECT"

      - name: Build and analyze
        # ARCHS=arm64 for the same reason as the iOS job: MLX is
        # Apple-Silicon-only, and the standard macOS arch set can include
        # x86_64. The app requires Apple Silicon anyway.
        #
        # The raw log is kept because xcpretty swallows compiler diagnostics.
        run: |
          set -o pipefail
          xcodebuild clean build analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild-macos.log | xcpretty

      - name: Surface compiler errors
        if: failure()
        run: |
          echo "===== error: lines, with context ====="
          grep -E -B2 -A8 "error:" /tmp/xcodebuild-macos.log | head -150 \
            || echo "(no 'error:' lines -- the failure was not a compile error)"
          echo "===== last 60 raw lines ====="
          tail -60 /tmp/xcodebuild-macos.log
