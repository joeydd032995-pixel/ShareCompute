plugins { id 'com.android.application' }
android {
    namespace 'com.sharecompute.worker'
    compileSdk 35
    ndkVersion System.getenv('SC_NDK_VERSION') ?: '27.0.12077973'
    defaultConfig {
        applicationId 'com.sharecompute.worker'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }
